spring.application.name=ledonsept27

# Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3306/dbappdevf1ledon
spring.datasource.username=root
spring.datasource.password=Ledonj@050605

# Hibernate dialect (Hibernate 6+)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# OR simply:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Auto schema update (careful: 'update' modifies DB schema automatically)
spring.jpa.hibernate.ddl-auto=update

# Optional Hibernate properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.error.include-stacktrace=never

# Security
security.basic.enabled=false
